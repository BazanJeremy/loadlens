# Thresholds of `loadlens verdict` (rules: docs/verdict.md).
#
# Every value is declared, not measured, unless its comment says otherwise. Each SLO holds for
# every candidate segment, for each transaction and for all transactions together; throughput
# is checked per transaction, against the rate the load profile declares.

apdex_t_ms: 300

# A broken hard SLO ends the verdict FAIL.
hard:
  p99_ms: 800 # p99 latency of successful samples must stay below
  error_rate: 0.005 # failed samples / all samples must stay below

# A broken soft SLO ends the verdict WARN.
soft:
  p95_ms: 300 # p95 latency of successful samples must stay below
  apdex: 0.90 # Apdex (T = apdex_t_ms) must reach at least
  throughput_tolerance: 0.05 # achieved rate must reach at least target x (1 - tolerance)

# Windowed regression detector, used only when a baseline is given (ADR-004).
# Calibrated values: changing any of the first five leaves the measured false-positive rate
# (1 A/A run out of 60, upper bound 7.7%) without a source.
regression:
  window_s: 5 # p95 computed per window of this many seconds
  min_window_samples: 5 # windows with fewer successful samples are left out
  alpha: 0.05 # one-sided Mann-Whitney U on window p95 values: p must be below
  min_delta_p95_rel: 0.10 # relative change of the p95 of all samples: must be above
  min_cliffs_delta: 0.147 # Cliff's delta on window p95 values: must be at least
  # Declared on 2026-10-18, not calibrated: fewer windows than this in either arm, for a
  # transaction, ends the verdict INCONCLUSIVE. Every comparison of the calibration campaign
  # (run 39058130424, 225 of them) had 24 windows per arm.
  min_windows_per_arm: 10
