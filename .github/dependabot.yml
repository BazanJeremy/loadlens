# Dependabot — monthly, grouped: at most one pull request per ecosystem.
# Without it, pinned actions and dependencies age without anyone noticing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sut
    schedule:
      interval: monthly
    groups:
      sut-python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /sut
    schedule:
      interval: monthly
    # Stay on the pinned Python line. Moving to a new minor is a migration to
    # decide, not a monthly bump: the 3.13 -> 3.15 pull request failed CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      sut-image:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /load/jmeter
    schedule:
      interval: monthly
    # Stay on the pinned Java line. Moving to a new release is a migration to
    # decide, not a monthly bump: the Temurin 21 -> 25 pull request failed CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      jmeter-image:
        patterns: ["*"]
