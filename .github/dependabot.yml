# Dependabot — monthly, grouped: at most one pull request per ecosystem.
# Without it, pinned actions and dependencies age without anyone noticing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sut
    schedule:
      interval: monthly
    groups:
      sut-python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /sut
    schedule:
      interval: monthly
    groups:
      sut-image:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /load/jmeter
    schedule:
      interval: monthly
    groups:
      jmeter-image:
        patterns: ["*"]
