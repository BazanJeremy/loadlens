name: Calibration

# Measures false positives (A/A runs) and power (runs with a regression switched on) of the
# candidate regression detectors, on the CI runners themselves. Started by hand; see
# docs/calibration.md for the protocol and the decision criteria.
on:
  workflow_dispatch:
    inputs:
      aa_runs:
        description: "A/A runs (the candidate is the baseline), 1-60"
        default: "10"
      regression_runs:
        description: "Runs per regression (N_PLUS_ONE, LOCK, POOL), 0-10"
        default: "2"
      hold_s:
        description: "Hold duration of each segment, in seconds"
        default: "60"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          AA_RUNS: ${{ inputs.aa_runs }}
          REGRESSION_RUNS: ${{ inputs.regression_runs }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          aa, rr = int(os.environ["AA_RUNS"]), int(os.environ["REGRESSION_RUNS"])
          if not (1 <= aa <= 60 and 0 <= rr <= 10):
              raise SystemExit("aa_runs must be 1-60 and regression_runs 0-10")
          runs = [{"id": f"aa-{i}", "mode": "none"} for i in range(1, aa + 1)]
          runs += [{"id": f"{m}-{i}", "mode": m}
                   for m in ("N_PLUS_ONE", "LOCK", "POOL") for i in range(1, rr + 1)]
          print("matrix=" + json.dumps(runs))
          EOF

  abba:
    needs: plan
    name: abba (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the JMeter image (layers cached between runs)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: load/jmeter
          tags: loadlens-jmeter:5.6.3
          load: true
          cache-from: type=gha,scope=jmeter
          cache-to: type=gha,scope=jmeter,mode=max
      - name: Build the system under test
        run: docker compose build
      - name: A-B-B-A run
        env:
          HOLD_S: ${{ inputs.hold_s }}
          CANDIDATE: ${{ matrix.mode }}
          RUN_ID: ${{ matrix.id }}
        run: bash load/abba.sh "$CANDIDATE" "results/$RUN_ID"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-${{ matrix.id }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop the system under test
        if: always()
        run: docker compose down -v

  analyze:
    needs: abba
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
      - name: Install loadlens
        run: python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: calibration-*
          path: runs
          merge-multiple: true
      - name: Analyze every completed run
        run: |
          python -m loadlens.calibration runs/*/ --json calibration.json | tee calibration.md
          cat calibration.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-report
          path: |
            calibration.md
            calibration.json
          retention-days: 90
