[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loadlens"
version = "0.0.1"
description = "Turns JMeter and LoadRunner results into a statistically defensible PASS / WARN / FAIL performance verdict"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jérémy Bazan" }]
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
loadlens = "loadlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "sut"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
